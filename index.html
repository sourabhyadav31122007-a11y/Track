<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0F1522">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>NEET Study & Revision Calendar</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;800&display=swap">
<style>
:root{--bg:#F2F5FA;--card:#fff;--ink:#1B2433;--mute:#69758A;--line:#DDE3EE;--p:#2F5BEA;--c:#D9800B;--b:#0E9F85;--o:#7A5AC8;--on:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1522;--card:#18202F;--ink:#E8EDF7;--mute:#8F9BB1;--line:#27324A;--p:#7C9BFF;--c:#F2A93B;--b:#3DD1B3;--o:#B49BF2;--on:#0F1522}}
:root[data-theme="dark"]{--bg:#0F1522;--card:#18202F;--ink:#E8EDF7;--mute:#8F9BB1;--line:#27324A;--p:#7C9BFF;--c:#F2A93B;--b:#3DD1B3;--o:#B49BF2;--on:#0F1522}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;line-height:1.4}
main{max-width:560px;margin:0 auto;padding:14px 12px 120px}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
h1{font-size:24px;font-weight:800;margin:0;letter-spacing:-.02em}
.nav{display:flex;gap:6px}
.nav button{background:var(--card);border:1px solid var(--line);border-radius:12px;width:44px;height:44px;font-size:20px}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:7px 4px;text-align:center}
.stat b{font-size:18px;display:block}
.stat span{font-size:11px;color:var(--mute)}
.p{--k:var(--p)}.c{--k:var(--c)}.b{--k:var(--b)}.o{--k:var(--o)}.z{--k:var(--z)}
:root{--z:#D63F7A}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--z:#FF7FAE}}
:root[data-theme="dark"]{--z:#FF7FAE}
.tl{font-size:9px;font-weight:800;border-radius:4px;padding:0 4px;line-height:14px;background:var(--ink);color:var(--bg)}
.tl.bb{background:var(--b);color:var(--on)}.tl.ai{background:#C0392B;color:#fff}
.tb{background:var(--bg);border-radius:12px;padding:10px;margin-top:10px}
.tn{font-weight:800;font-size:15px;margin-bottom:6px}
.ts{display:flex;gap:8px;margin:8px 0}
.ts>b{width:76px;flex:none;font-size:13px;color:var(--k);padding-top:6px}
.tc{display:flex;flex-wrap:wrap;gap:6px}
.sch{display:flex;justify-content:space-between;align-items:center;width:100%;min-height:36px;background:none;border:none;padding:0;text-align:left}
.sch h2{margin:0}
.sch em{font-style:normal;color:var(--mute);font-size:14px}
.sub{display:flex;align-items:center;gap:10px;width:100%;min-height:46px;background:none;border:none;border-top:1px solid var(--line);padding:6px 0;text-align:left}
.sub .sn{width:76px;font-weight:600;color:var(--k)}
.sbar2{flex:1;height:8px;background:var(--bg);border-radius:4px;position:relative;overflow:hidden}
.sbar2 i,.sbar2 u{position:absolute;left:0;top:0;bottom:0;background:var(--k);text-decoration:none}
.sbar2 i{opacity:.35}
.sub b{font-size:13px;min-width:44px;text-align:right}
.chr{display:flex;align-items:center;gap:10px;width:100%;min-height:48px;background:none;border:none;border-top:1px dashed var(--line);padding:6px 0;text-align:left}
.chr .cn{flex:1;font-size:14px}
.chr small{display:block;color:var(--mute);font-size:12px}
.st{width:12px;height:12px;border-radius:50%;border:2px solid var(--line);flex:none}
.st.sd{background:var(--k);border-color:var(--k)}
.st.rv{background:var(--k);border-color:var(--k);box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--k)}
.tgb{background:none;border:none;width:44px;height:44px;display:grid;place-items:center;flex:none;margin-left:-8px}
.chr .go{font-size:13px;font-weight:600;color:var(--k);border:1.5px solid var(--k);background:none;border-radius:16px;height:36px;padding:0 12px;white-space:nowrap}
.srow{display:flex;align-items:center;gap:10px;width:100%;background:none;border:none;padding:9px 0;border-top:1px solid var(--line);text-align:left}
.srow .tl{min-width:48px;text-align:center}
.sbar{flex:1;height:8px;background:var(--bg);border-radius:4px;overflow:hidden}
.sbar i{display:block;height:100%;background:var(--ink)}
.srow b{font-size:14px;min-width:68px;text-align:right}
.scr{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
.chipS{font-size:13px;font-weight:600;color:var(--k);border:1.5px solid var(--k);border-radius:14px;padding:2px 10px}
.btn{border:none;border-radius:12px;height:44px;padding:0 14px;font-weight:600;background:var(--ink);color:var(--bg);font-size:14px}
.btn.alt{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
#bkTxt{width:100%;height:96px;margin:10px 0;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font-size:13px;padding:10px;resize:vertical}
.tchip{border:1.5px solid var(--k);background:transparent;color:var(--ink);border-radius:16px;min-height:36px;padding:2px 10px;font-size:13px;text-align:left}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
.card h2{margin:0 0 8px;font-size:17px}
.due-item{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.due-item:first-of-type{border-top:none}
.due-item .tx{flex:1;min-width:0;font-size:15px}
.due-item small{display:block;color:var(--mute);font-size:12px}
.bar{width:5px;align-self:stretch;border-radius:3px;background:var(--k)}
.rev{background:var(--k);color:var(--on);border:none;border-radius:10px;padding:0 14px;height:40px;font-weight:600}
.x{background:none;border:none;color:var(--mute);font-size:22px;width:40px;height:40px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow{font-size:12px;color:var(--mute);text-align:center;padding:2px 0}
.day{min-height:68px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:4px 2px 5px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:2px}
.day.blank{background:none;border:none}
.day .n{font-size:14px;font-weight:600}
.day.today .n{background:var(--ink);color:var(--bg);border-radius:50%;width:24px;height:24px;display:grid;place-items:center}
.day.sel{outline:2px solid var(--ink);outline-offset:1px}
.day.due{box-shadow:inset 0 -4px 0 var(--mute)}
.dots{display:flex;flex-wrap:wrap;gap:3px;justify-content:center;min-height:8px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--k);display:block}
.dot.q{border-radius:2px}
.qrow{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:13px}
.qrow>span:first-child{width:72px;color:var(--k);font-weight:600}
.qbar{flex:1;height:8px;background:var(--bg);border-radius:4px;overflow:hidden}
.qbar i{display:block;height:100%;background:var(--k)}
.qrow b{text-align:right;font-size:12px}
.qt{width:52px;height:30px;font-size:14px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);text-align:center}
.dot.r{background:transparent;border:2px solid var(--k)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--mute);margin:10px 2px 12px;align-items:center}
.legend span{display:flex;align-items:center;gap:5px}
.legend .dot{display:inline-block}
.legend .ln{width:14px;height:4px;background:var(--mute);border-radius:2px}
.dh{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.dh em{font-style:normal;color:var(--mute);font-size:14px}
.sec{margin-top:12px}
.sec h3{margin:0 0 6px;font-size:14px;color:var(--mute);font-weight:600}
.item{display:flex;align-items:center;gap:8px;padding:8px 8px 8px 0;border-radius:8px;margin-bottom:4px;font-size:15px}
.item .tx{flex:1;min-width:0;word-break:break-word}
.item small{color:var(--mute);font-size:12px;display:block}
.tag{font-size:12px;font-weight:600;color:var(--k);white-space:nowrap}
.empty{font-size:14px;color:var(--mute);margin:8px 0 0}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));height:56px;padding:0 22px;border-radius:28px;border:none;background:var(--ink);color:var(--bg);font-weight:800;font-size:16px;box-shadow:0 6px 20px rgba(0,0,0,.28);z-index:5}
.bd{position:fixed;inset:0;background:rgba(10,15,25,.55);z-index:10}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:92%;overflow-y:auto;overscroll-behavior:contain;background:var(--card);border-radius:20px 20px 0 0;padding:14px 16px calc(18px + env(safe-area-inset-bottom,0px));z-index:11;max-width:560px;margin:0 auto}
.sheet h2{margin:0 0 10px;font-size:18px}
.seg{display:grid;grid-template-columns:1fr 1fr 1fr;background:var(--bg);border-radius:12px;padding:3px;margin-bottom:12px}
.seg button{border:none;background:none;height:42px;border-radius:10px;font-weight:600}
.seg button.on{background:var(--ink);color:var(--bg)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{border:1.5px solid var(--line);background:var(--bg);border-radius:20px;height:40px;padding:0 14px;font-weight:600}
.chip.on{background:var(--k,var(--ink));border-color:var(--k,var(--ink));color:var(--on)}
.sheet label.l{display:block;font-size:13px;color:var(--mute);margin:2px 0 6px}
.sheet select,.sheet input[type=text],.sheet input[type=number]{width:100%;height:48px;font-size:16px;padding:0 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);margin-bottom:12px}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:14px;margin:4px 0 14px}
.chk input{width:22px;height:22px;margin:0;flex:none}
.save{width:100%;height:52px;border:none;border-radius:14px;background:var(--ink);color:var(--bg);font-weight:800;font-size:16px}
.err{color:#D93B3B;font-size:14px;margin:0 0 8px}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
</style>
</head>
<body>
<main>
  <div class="top">
    <h1 id="title"></h1>
    <div class="nav"><button id="prev" aria-label="Previous month">‹</button><button id="next" aria-label="Next month">›</button></div>
  </div>
  <div class="stats">
    <div class="stat"><b id="stS">0</b><span>Studied</span></div>
    <div class="stat"><b id="stR">0</b><span>Revised</span></div>
    <div class="stat"><b id="stQ">0</b><span>Qs</span></div>
    <div class="stat"><b id="stT">0m</b><span>Time</span></div>
    <div class="stat"><b id="stK">0</b><span>Streak</span></div>
  </div>
  <div class="card" id="nextCard" hidden></div>
  <div class="card" id="dueCard" hidden></div>
  <div class="grid" id="dows"></div>
  <div class="grid" id="grid" style="margin-top:4px"></div>
  <div class="legend">
    <span class="p"><i class="dot"></i>Physics</span><span class="c"><i class="dot"></i>Chemistry</span><span class="b"><i class="dot"></i>Botany</span><span class="z"><i class="dot"></i>Zoology</span>
    <span><i class="dot" style="background:var(--mute)"></i>Studied</span><span><i class="dot" style="background:transparent;border:2px solid var(--mute)"></i>Revised</span><span><i class="ln"></i>Revision due</span><span><i class="dot q" style="background:var(--mute)"></i>Practice</span><span>PM Pro Max · BB Bio Booster · AITS</span>
  </div>
  <div class="card" id="panel"></div>
  <div class="card" id="sylCard"></div>
  <div class="card" id="scCard" hidden></div>
  <div class="card" id="bkCard">
    <button class="sch" id="bkTog" aria-expanded="false"><h2>Backup &amp; restore</h2><em id="bkArrow">▾</em></button>
    <div id="bkBody" hidden>
      <p class="empty" style="margin:10px 0">Your data is stored on this device only. Copy a backup before switching phones, browsers or apps.</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="bkCopy">Copy backup</button><button class="btn alt" id="bkDl">Download file</button><label class="btn alt" style="display:grid;place-items:center">Open file<input type="file" id="bkFile" accept=".json,application/json" hidden></label></div>
      <textarea id="bkTxt" placeholder="Backup text appears here. Paste a backup here to restore it." spellcheck="false"></textarea>
      <button class="btn alt" id="bkRestore" style="width:100%">Restore from text</button>
      <p class="empty" id="bkMsg"></p>
    </div>
  </div>
</main>
<button class="fab" id="fab">+ Log</button>
<div class="bd" id="bd" hidden></div>
<div class="sheet" id="sheet" hidden>
  <h2 id="shTitle"></h2>
  <div class="seg"><button data-t="s">Studied</button><button data-t="r">Revised</button><button data-t="q">Practice</button></div>
  <div class="chips" id="subChips"></div>
  <div id="chBox"><label class="l" for="chSel">Chapter</label><select id="chSel"></select></div>
  <div id="chCBox" hidden><label class="l" for="chCustom">Chapter name</label><input type="text" id="chCustom" maxlength="80" placeholder="Type chapter"></div>
  <div id="qBox" hidden><div style="display:flex;gap:10px"><div style="flex:1"><label class="l" for="qAtt">Questions attempted</label><input type="number" id="qAtt" inputmode="numeric" min="0" placeholder="e.g. 45"></div><div style="flex:1"><label class="l" for="qCor">Correct</label><input type="number" id="qCor" inputmode="numeric" min="0" placeholder="e.g. 32"></div></div></div>
  <label class="l" for="topic">Topic or note (optional)</label>
  <input type="text" id="topic" maxlength="100" placeholder="e.g. Numericals, NCERT lines">
  <label class="l">Time spent</label>
  <div class="chips" id="minChips"></div>
  <input type="number" id="min" inputmode="numeric" min="0" max="900" placeholder="Minutes">
  <label class="chk" id="remRow"><input type="checkbox" id="remChk" checked><span>Remind me to revise this after 1, 3, 7 and 21 days</span></label>
  <p class="err" id="err" hidden></p>
  <button class="save" id="save">Save</button>
</div>
<div class="sheet" id="scSheet" hidden>
  <h2 id="scTitle"></h2>
  <div id="scFields"></div>
  <p class="empty" style="margin:0 0 12px">Total: <b id="scTot"></b></p>
  <label class="l" for="scNote">Note (optional)</label>
  <input type="text" id="scNote" maxlength="100" placeholder="e.g. Silly mistakes in Physics">
  <p class="err" id="scErr" hidden></p>
  <button class="save" id="scSave">Save score</button>
  <button class="x" id="scDel" hidden style="width:100%;height:46px;font-size:15px;color:#D93B3B;margin-top:6px">Delete score</button>
</div>

function nudges(){
  const out=[],seen={};
  const pend=new Set(data.rem.filter(r=>!r.done&&r.due<=todayKey).map(r=>r.sub+'|'+r.ch));
  const add=(kind,sub,ch,why,rank)=>{const k=sub+'|'+ch;if(seen[k]||pend.has(k))return;seen[k]=1;out.push({kind,sub,ch,why,rank})};
  const t=TESTS.find(x=>x.d>=todayKey);
  if(t){const n=diff(t.d,todayKey),tw=tname(t)+' in '+n+' day'+(n===1?'':'s');if(n<=7)Object.entries(t.s).forEach(([sub,l])=>l.forEach(ch=>{const o=data.syl[sub+'|'+ch];if(!o)add('c',sub,ch,'Not completed · '+tw,0);else if(diff(todayKey,o.l)>=5)add('r',sub,ch,'Revise · '+tw,0)}))}
  const gaps=[7,14,30,45];
  Object.keys(data.syl).forEach(k=>{const o=data.syl[k],ago=diff(todayKey,o.l);if(ago>=gaps[Math.min(o.r,3)]){const [sub,ch]=k.split('|');add('r',sub,ch,(o.r?'Last revised ':'Completed ')+ago+' days ago',1-ago/1000)}});
  return out.sort((a,b)=>a.rank-b.rank).slice(0,6);
}

  if(e.target.closest('[data-syltog]')){data.sylOpen=!data.sylOpen;save();renderSyl();return}
  const t=e.target.closest('[data-sylsubtog]');if(t){data.sylSub=data.sylSub===t.dataset.sylsubtog?null:t.dataset.sylsubtog;save();renderSyl();return}
  const tg=e.target.closest('[data-tg]');
  if(tg){const k=tg.dataset.tg;if(data.syl[k])delete data.syl[k];else data.syl[k]={d:todayKey,r:0,l:todayKey};save();render();return}
  const rv=e.target.closest('[data-rv]');
  if(rv){const o=data.syl[rv.dataset.rv];if(o){o.r++;o.l=todayKey;save();render()}}
});
$('scFields').addEventListener('input',updTot);
$('scSave').onclick=()=>{
  const o={};let n=0,bad=false;
  document.querySelectorAll('[data-sc]').forEach(i=>{if(i.value!==''){const v=+i.value;if(isNaN(v)||v<-45||v>180)bad=true;else{o[i.dataset.sc]=v;n++}}});
  if(bad||!n){$('scErr').textContent=bad?'Marks must be between -45 and 180 for each subject.':'Enter marks for at least one subject.';$('scErr').hidden=false;return}
  o.note=$('scNote').value.trim();data.scores[SC.d]=o;save();closeSheet();render();
};
$('scDel').onclick=()=>{delete data.scores[SC.d];save();closeSheet();render()};
const bkMsg=m=>{$('bkMsg').textContent=m};
$('bkTog').onclick=()=>{const b=$('bkBody');b.hidden=!b.hidden;$('bkTog').setAttribute('aria-expanded',!b.hidden);$('bkArrow').textContent=b.hidden?'▾':'▴'};
const bkText=()=>JSON.stringify(data);
$('bkCopy').onclick=async()=>{const t=bkText();$('bkTxt').value=t;
  try{await navigator.clipboard.writeText(t);bkMsg('Backup copied. Paste it somewhere safe, or into the restore box in the new app.')}
  catch(e){$('bkTxt').focus();$('bkTxt').select();bkMsg('Select all the text in the box and copy it manually.')}};
$('bkDl').onclick=()=>{try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([bkText()],{type:'application/json'}));a.download='neet-tracker-backup-'+todayKey+'.json';document.body.appendChild(a);a.click();a.remove();bkMsg('Backup file saved to your downloads.')}catch(e){bkMsg('Download is not available here. Use Copy backup instead.')}};
function restoreFrom(txt){
  let o;try{o=JSON.parse(txt)}catch(e){bkMsg('That does not look like a backup.');return}
  if(!o||typeof o.entries!=='object'||o.entries===null){bkMsg('That does not look like a backup.');return}
  data=Object.assign({entries:{},rem:[],scores:{},syl:{}},o);data.pastMarked=true;save();render();bkMsg('Restored. Your logs, scores and syllabus are back.');
}
let rsArm=0;
$('bkRestore').onclick=()=>{const t=$('bkTxt').value.trim();if(!t){bkMsg('Paste your backup text first.');return}
  if(!rsArm){rsArm=1;$('bkRestore').textContent='Tap again to replace current data';setTimeout(()=>{rsArm=0;$('bkRestore').textContent='Restore from text'},4000);return}
  rsArm=0;$('bkRestore').textContent='Restore from text';restoreFrom(t)};
$('bkFile').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$('bkTxt').value=r.result;bkMsg('File loaded. Tap Restore from text to apply it.')};r.readAsText(f)};
if(!data.pastMarked){const n=markPast();data.pastMarked=true;save();sylMsg=n?`Marked ${n} chapters from your past tests as completed.`:''}
render();
</script>
<script>
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
</script>
